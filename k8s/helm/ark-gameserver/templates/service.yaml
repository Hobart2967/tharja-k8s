---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: game
      port: {{ .Values.ports.game }}
      targetPort: 7777
    - name: game-ext
      port: {{ .Values.ports.gameExt }}
      targetPort: 7778
    - name: query
      port: {{ .Values.ports.query }}
      targetPort: 27015
    - name: rcon
      port: {{ .Values.ports.rcon }}
      targetPort: 27020