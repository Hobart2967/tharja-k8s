---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: game
      port: {{ .Values.ports.game }}
      targetPort: game
    - name: game-ext
      port: {{ add .Values.ports.game 1 }}
      targetPort: game-ext
    - name: query
      port: {{ .Values.ports.query }}
      targetPort: query
    - name: rcon
      port: {{ .Values.ports.rcon }}
      targetPort: rcon