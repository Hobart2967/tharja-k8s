apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-status
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-status-exec
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames:
      - {{ .Release.Name }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames:
      - {{ .Release.Name }}
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-status-exec
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-status
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-status-exec
