apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "hermsi/ark-server:latest"
          imagePullPolicy: IfNotPresent
          tty: true       # <-- Crucial line: Allocates a pseudo-TTY
          stdin: true     # <-- Crucial line: Keeps standard input open
          #command:
          #  - /bin/bash
          #  - -lc
          #args:
          #  - >-
          #    mkdir -p /ark-app/server /ark-app/staging /app/arkmanager/instances &&
          #    chown -R steam:steam /app/arkmanager &&
          #    rm -rf /app/server /app/staging &&
          #    ln -s /ark-app/server /app/server &&
          #    ln -s /ark-app/staging /app/staging &&
          #    exec /usr/sbin/gosu steam /steam-entrypoint.sh
          ports:
            - name: game
              containerPort: 7777
              protocol: UDP
            - name: game-ext
              containerPort: 7778
              protocol: UDP
            - name: query
              containerPort: 27015
              protocol: UDP
            - name: rcon
              containerPort: 27020
              protocol: TCP
          env:
            - name: ARK_SERVER_VOLUME
              value: /app
            - name: ARK_EXTRA_OPTS
              value: " -servergamelog -log"
            - name: SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: ARK_SERVER_NAME
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.arkServerPasswordSecretName }}
                  key: password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.arkServerAdminPasswordSecretName }}
                  key: admin_password
            - name: SESSION_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: SESSION_NAME
            - name: SERVER_MAP
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: SERVER_MAP
            - name: MAX_PLAYERS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: MAX_PLAYERS
            - name: UPDATE_ON_START
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: UPDATE_ON_START
            - name: BACKUP_ON_STOP
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: BACKUP_ON_STOP
            - name: PRE_UPDATE_BACKUP
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: PRE_UPDATE_BACKUP
            - name: WARN_ON_STOP
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: WARN_ON_STOP
            - name: GAME_MOD_IDS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: GAME_MOD_IDS
          volumeMounts:
            - name: instance-config
              mountPath: /app/arkmanager/instances/main.cfg
              subPath: instance.cfg
            - name: ark-data
              mountPath: /ark-data
            - name: ark-app
              mountPath: /app
            - name: ark-backup
              mountPath: /app/backup
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
      volumes:
        - name: ark-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: ark-app
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-app
        - name: ark-backup
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-backup
        - name: instance-config
          configMap:
            # Provide the name of the ConfigMap you want to mount.
            name: {{ .Release.Name }}-instance-config
            # An array of keys from the ConfigMap to create as files
            items:
            - key: "content"
              path: "instance.cfg"
