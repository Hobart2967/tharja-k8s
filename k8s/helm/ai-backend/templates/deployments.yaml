{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          {{- if eq $name "speaches" }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          {{- else if eq $name "ollama" }}
          startupProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 30
          {{- end }}
          env:
            {{- toYaml $svc.env | nindent 12 }}
          {{- if $svc.storage.enabled }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ $svc.storage.mountPath }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      {{- if $svc.storage.enabled }}
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ $name }}
      {{- end }}
{{- end }}
{{- end }}
