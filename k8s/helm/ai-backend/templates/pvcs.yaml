{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $svc.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ $svc.storage.size }}
{{- end }}
{{- end }}
