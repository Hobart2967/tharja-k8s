rateLimit:
  enabled: true
  average: 20   # sustained requests per second, per client IP
  burst: 80     # short spike allowance
  period: 1s

crowdsec:
  enabled: true
  middleware:
    name: crowdsec-bouncer
    namespace: sys-crowdsec

webfacade:
  enabled: true
  storageSize: 2Gi
  storage:
    mountPath: /var/www/html

  image: nginx:1.31.2-alpine
  imagePullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 80
  additionalPvcs: []
  extraMounts: []
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

dnsRecords: []
