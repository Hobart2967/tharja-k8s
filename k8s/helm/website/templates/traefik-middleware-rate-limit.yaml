{{- if .Values.rateLimit.enabled }}
# e.g. templates/traefik-middleware-rate-limit.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-rate-limit
  namespace: {{ .Release.Namespace }}
spec:
  rateLimit:
    average: {{ .Values.rateLimit.average }}   # sustained requests per second, per client IP
    burst: {{ .Values.rateLimit.burst }}     # short spike allowance
    period: {{ .Values.rateLimit.period }}
    sourceCriterion:
      ipStrategy:
        depth: 1
{{- end }}