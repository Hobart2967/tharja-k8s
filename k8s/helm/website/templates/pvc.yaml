{{ if .Values.webfacade.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-projects-retained
  resources:
    requests:
      storage: {{ .Values.webfacade.storageSize }}
{{ end }}