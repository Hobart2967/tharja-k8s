{{ if .Values.webfacade.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.webfacade.storageClassName }}
  resources:
    requests:
      size: {{ .Values.webfacade.storageSize }}
      storage: {{ .Values.webfacade.storageSize }}
{{ end }}