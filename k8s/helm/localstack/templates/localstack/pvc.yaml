---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.localstack.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.localstack.persistence.size }}