# API key used by the Traefik plugin to authenticate with CrowdSec LAPI.
# Must match the bouncer key registered in CrowdSec.
# Populated at deploy time via bouncer-key.sh from the crowdsec-bouncer-key K8s secret.
apiKeySecretRef:
  name: crowdsec-bouncer-key
  key: api-key

# CrowdSec LAPI connection settings
lapiHost: crowdsec-service.sys-crowdsec.svc.cluster.local
lapiPort: "8080"
lapiScheme: http

# Use stream mode so the bouncer consumes decisions incrementally
# instead of querying LAPI alerts on every request.
mode: stream

# Stream resilience: don't fail closed if LAPI sync temporarily fails.
updateMaxFailure: -1
streamStartupBlock: false

# Clients/subnets that bypass bouncer checks (useful behind NAT/LB).
clientTrustedIPs: []
