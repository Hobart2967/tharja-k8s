{{ $apiKeySecretRef := .Values.apiKeySecretRef | default (dict "name" (printf "%s-crowdsec-bouncer" .Release.Name) "key" "api-key") }}
{{ $apiKeySecret := lookup "v1" "Secret" .Release.Namespace $apiKeySecretRef.name }}
{{- $lapiHost := .Values.lapiHost -}}
{{- if and .Values.lapiPort (not (regexMatch ":[0-9]+$" $lapiHost)) -}}
{{- $lapiHost = printf "%s:%s" $lapiHost .Values.lapiPort -}}
{{- end -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: {{ .Release.Namespace }}
spec:
  plugin:
    crowdsec-bouncer-traefik-plugin:
      enabled: true
      crowdSecLapiKey: {{ (index $apiKeySecret.data $apiKeySecretRef.key) | b64dec | quote }}
      crowdSecLapiHost: {{ $lapiHost | quote }}
      crowdSecLapiScheme: {{ .Values.lapiScheme | quote }}
      crowdSecMode: {{ .Values.mode | quote }}
      {{- if hasKey .Values "updateMaxFailure" }}
      updateMaxFailure: {{ .Values.updateMaxFailure }}
      {{- end }}
      {{- if hasKey .Values "streamStartupBlock" }}
      streamStartupBlock: {{ .Values.streamStartupBlock }}
      {{- end }}
      {{- if .Values.clientTrustedIPs }}
      clientTrustedIPs:
      {{- range $ip := .Values.clientTrustedIPs }}
        - {{ $ip | quote }}
      {{- end }}
      {{- end }}
