---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-plugins-available
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.pluginsAvailable.storageClassName }}
  resources:
    requests:
      size: {{ .Values.persistence.pluginsAvailable.size }}
      storage: {{ .Values.persistence.pluginsAvailable.size }}