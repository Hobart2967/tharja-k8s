---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-worlds
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.worlds.storageClassName }}
  resources:
    requests:
      size: {{ .Values.persistence.worlds.size }}
      storage: {{ .Values.persistence.worlds.size }}