---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  pebble-config.json: |
    {
      "pebble": {
        "listenAddress": "{{ .Values.pebble.listenAddress }}",
        "managementListenAddress": "{{ .Values.pebble.managementListenAddress }}",
        "certificate": "/etc/pebble/tls/tls.crt",
        "privateKey": "/etc/pebble/tls/tls.key",
        "httpPort": {{ .Values.pebble.httpPort }},
        "tlsPort": {{ .Values.pebble.tlsPort }}
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: acme
      port: {{ .Values.service.acmePort }}
      targetPort: acme
      protocol: TCP
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP