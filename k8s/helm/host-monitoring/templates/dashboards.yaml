{{- $instanceLabels := .Values.instance.labels | default (dict "dashboards" "grafana") -}}
{{- range $name, $dash := .Values.gnetDashboards }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ printf "%s-%s" $.Release.Name $name | lower | replace "." "-" | replace "_" "-" }}
  namespace: {{ $.Release.Namespace }}
spec:
  allowCrossNamespaceImport: true
  folderUID: {{ $.Release.Name }}
  instanceSelector:
    matchLabels:
{{- toYaml $instanceLabels | nindent 6 }}
  grafanaCom:
    id: {{ $dash.gnetId }}
    revision: {{ $dash.revision | default 1 }}
{{- if hasKey $dash "datasource" }}
  datasources:
{{- range $ds := $dash.datasource }}
    - inputName: {{ $ds.name | quote }}
      datasourceName: {{ $ds.value | quote }}
{{- end }}
{{- end }}
{{- end }}
