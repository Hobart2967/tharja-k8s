apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  instanceSelector:
    matchLabels:
{{- toYaml .Values.instance.labels | nindent 6 }}
  allowCrossNamespaceImport: true
  folderUID: {{ .Release.Name }}
  interval: "5m"
  rules:
    - {{ tpl (.Files.Get "alerts/fs-close-to-max.yaml") . | nindent 6 }}
