---
releases:
  - name: project
    namespace: project-minecraft-avsn
    createNamespace: true
    chart: ../../helm/project
    values:
      - memory:
          max: 12Gi
        cpu:
          max: 4

  - name: minecraft-traefik-endpoint
    chart: ../../helm/traefik-endpoint
    namespace: sys-traefik
    createNamespace: true
    values:
      - endpoints:
          - name: minecraft
            port: 25565
            protocol: TCP

  - name: avsn-minecraft
    chart: ../../helm/minecraft-gameserver
    namespace: project-minecraft-avsn
    createNamespace: true
    values:
      - ./values/minecraft.yaml

  - name: dynmap
    chart: ../../helm/website
    namespace: project-minecraft-avsn
    createNamespace: true
    values:
      - ./values/dynmap.yaml