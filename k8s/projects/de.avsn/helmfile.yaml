---
releases:
  - name: project
    namespace: project-de-avsn
    createNamespace: true
    chart: ../../helm/project
    values:
      - memory:
          max: 512Mi

  - name: website
    chart: ../../helm/website
    namespace: project-de-avsn
    createNamespace: true
    values:
      - ./values/website.yaml
      - ./values/dns.yaml.gotmpl

  - name: database
    chart: ../../helm/mariadb-database
    namespace: project-de-avsn
    createNamespace: true
    values:
      - ./values/database.yaml