---
repositories:
  - name: mariadb-operator
    url: https://mariadb-operator.github.io/mariadb-operator

releases:
  - name: project
    namespace: sys-mariadb
    createNamespace: true
    chart: ../../helm/project

  - name: mariadb-operator
    namespace: sys-mariadb
    createNamespace: true
    chart: mariadb-operator/mariadb-operator
    version: "26.6.0"
    installed: true
    values:
      - resources:
          requests:
            cpu: 300m
            memory: 128Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 300Mi

      - webhook:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      - certController:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi