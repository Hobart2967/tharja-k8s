---
releases:
  - name: project-public-dns
    namespace: sys-dns
    createNamespace: true
    chart: ../../helm/project
    values:
      - memory:
          max: 1Gi
        cpu:
          max: 1

  - name: public-dns
    namespace: sys-dns
    createNamespace: true
    chart: ../../helm/dns-cluster
    values:
      - ./values.yaml