---
repositories:
  - name: docker-mailserver
    url: https://docker-mailserver.github.io/docker-mailserver-helm/

releases:
  - name: sys-mail
    namespace: sys-mail
    createNamespace: true
    chart: ../../helm/project
    values:
      - memory:
          max: 2Gi
        cpu:
          max: 2

  - name: marcoklein-engineer-mail
    namespace: sys-mail
    createNamespace: true
    chart: ../../helm/cert-request
    values:
      - dnsNames:
          - marcoklein.engineer

  - name: mail
    namespace: sys-mail
    createNamespace: true
    chart: docker-mailserver/docker-mailserver
    version: 5.1.1
    needs:
      - sys-mail/marcoklein-engineer-mail
    values:
      - certificate: marcoklein-engineer-mail-certificate
        deployment:
          env:
            OVERRIDE_HOSTNAME: marcoklein.engineer
