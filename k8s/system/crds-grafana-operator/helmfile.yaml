---
repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts/

releases:
  - name: grafana-operator-crds
    chart: bedag/raw
    disableValidation: true
    namespace: monitoring
    createNamespace: true
    hooks:
      - events: ["prepare"]
        showlogs: true
        command: sh
        args:
          - -ec
          - |
            GRAFANA_OPERATOR_VERSION="5.25.0"
            helm repo add grafana https://grafana.github.io/helm-charts >/dev/null 2>&1 || true
            helm show crds grafana/grafana-operator --version "$GRAFANA_OPERATOR_VERSION" | kubectl apply -f -
