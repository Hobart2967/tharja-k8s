container_runtime: docker
prometheus:
  enabled: true
  level: full

config:
  scenarios:
    # Relaxed replacement for crowdsecurity/http-crawl-non_statics.
    # The upstream default can be too strict for API-heavy UIs and mobile apps.
    local-http-crawl-non_statics.yaml: |
      type: leaky
      name: local/http-crawl-non_statics-relaxed
      description: "Detect aggressive crawl on non static resources (relaxed local tuning)"
      filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log'] && evt.Parsed.static_ressource == 'false' && evt.Parsed.verb in ['GET', 'HEAD']"
      distinct: "evt.Parsed.file_name"
      capacity: 120
      leakspeed: 200ms
      labels:
        service: http
        type: crawl
        remediation: true

agent:
  # Acquire logs from running pods for threat detection
  additionalAcquisition:
    # Host ssh auth logs
    - source: file
      filenames:
        - /var/log/auth.log
      labels:
        type: syslog
      poll_without_inotify: true

  acquisition:
    - namespace: sys-traefik
      podName: traefik-operator-*
      program: traefik
      poll_without_inotify: true

    # Minecraft game server
    - namespace: project-minecraft-avsn
      podName: avsn-minecraft-*
      program: minecraft
      poll_without_inotify: true

    # ARK game servers
    - namespace: project-ark
      podName: ark-*
      program: syslog
      poll_without_inotify: true

    # LocalStack security proxy
    - namespace: sys-localstack
      podName: localstack-localstack-security-*
      program: syslog
      poll_without_inotify: true

    # DNS / bind9 (bindy-managed Bind9Instance)
    - namespace: sys-dns
      podName: public-dns-*
      program: named
      poll_without_inotify: true

    # Mail server – postfix
    # Only watch the long-lived docker-mailserver pod; setup-mailbox Job pods are
    # temporary and their log files disappear after the TTL cleanup, which triggers
    # these stale-file warnings from CrowdSec's inotify watcher.
    - namespace: sys-mail
      podName: mail-docker-mailserver-*
      program: postfix
      poll_without_inotify: true

    # Mail server – dovecot
    - namespace: sys-mail
      podName: mail-docker-mailserver-*
      program: dovecot
      poll_without_inotify: true

    # Grafana (kube-prometheus-stack)
    - namespace: monitoring
      podName: prometheus-grafana-*
      program: grafana
      poll_without_inotify: true

    # ntfy notification server
    - namespace: sys-ntfy
      podName: ntfy-*
      program: ntfy
      poll_without_inotify: true

  env:
    - name: COLLECTIONS
      value: >-
        crowdsecurity/traefik
        crowdsecurity/linux
        crowdsecurity/postfix
        crowdsecurity/dovecot
        mstilkerich/bind9
        LePresidente/grafana
        crowdsecurity/sshd
      # Jgigantino31/ntfy
    - name: DISABLE_SCENARIOS
      value: crowdsecurity/http-crawl-non_statics

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-grafana

lapi:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-grafana

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # The Traefik bouncer key is stored in the crowdsec-bouncer-key K8s secret.
  # The secret must be pre-created via host-secrets (1Password vault entry:
  # "crowdsec-bouncer-key" with field "api-key").
  env:
    - name: BOUNCER_KEY_TRAEFIK
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncer-key
          key: api-key

  # Register the Traefik bouncer on LAPI startup using the predefined key
  lifecycle:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            until cscli lapi status > /dev/null 2>&1; do
              echo "Waiting for CrowdSec LAPI..."
              sleep 2
            done
            cscli bouncers delete traefik-bouncer 2>/dev/null || true
            cscli bouncers add traefik-bouncer --key "${BOUNCER_KEY_TRAEFIK}"
            echo "Traefik bouncer registered"

  persistentVolume:
    data:
      enabled: true
      size: 1Gi
    config:
      enabled: true
      size: 100Mi
