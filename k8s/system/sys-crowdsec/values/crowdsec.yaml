# The chart's Docker mode mounts the node's /var/log tree used by the explicit
# file acquisitions below. Keep it until those acquisitions are migrated.
container_runtime: docker
prometheus:
  enabled: true
  level: full

config:
  profiles.yaml: |
    name: mail_fast_spam_duration
    filters:
      - "Alert.GetScenario() == 'local/dovecot-bf-fast' || Alert.GetScenario() == 'local/postfix-sasl-bf'"
    decisions:
      - type: ban
        duration: 5m
    on_success: break
    ---
    name: default_ip_remediation
    #debug: true
    filters:
    - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
    - type: ban
      duration: 24h
    #duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
    # notifications:
    #   - slack_default  # Set the webhook in /etc/crowdsec/notifications/slack.yaml before enabling this.
    #   - splunk_default # Set the splunk url and token in /etc/crowdsec/notifications/splunk.yaml before enabling this.
    #   - http_default   # Set the required http parameters in /etc/crowdsec/notifications/http.yaml before enabling this.
    #   - email_default  # Set the required email parameters in /etc/crowdsec/notifications/email.yaml before enabling this.
    on_success: break
    ---
    name: default_range_remediation
    #debug: true
    filters:
    - Alert.Remediation == true && Alert.GetScope() == "Range"
    decisions:
    - type: ban
      duration: 24h
    #duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
    # notifications:
    #   - slack_default  # Set the webhook in /etc/crowdsec/notifications/slack.yaml before enabling this.
    #   - splunk_default # Set the splunk url and token in /etc/crowdsec/notifications/splunk.yaml before enabling this.
    #   - http_default   # Set the required http parameters in /etc/crowdsec/notifications/http.yaml before enabling this.
    #   - email_default  # Set the required email parameters in /etc/crowdsec/notifications/email.yaml before enabling this.
    on_success: break
  scenarios:
    # Relaxed replacement for crowdsecurity/http-crawl-non_statics.
    # The upstream default can be too strict for API-heavy UIs and mobile apps.
    local-http-crawl-non-statics.yaml: |
      type: leaky
      name: local/http-crawl-non_statics-relaxed
      description: "Detect aggressive crawl on non static resources (relaxed local tuning)"
      filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log'] && evt.Parsed.static_ressource == 'false' && evt.Parsed.verb in ['GET', 'HEAD']"
      distinct: "evt.Parsed.file_name"
      capacity: 120
      leakspeed: 200ms
      labels:
        service: http
        type: crawl
        remediation: true
    local-postfix-sasl-bf.yaml: |
      type: leaky
      name: local/postfix-sasl-bf
      description: "Detect Postfix SASL authentication bruteforce"
      filter: "evt.Meta.log_type == 'postfix' && (evt.Meta.log_type_enh == 'spam-attempt' || (evt.Parsed.message contains 'SASL LOGIN authentication failed' || evt.Line.Raw contains 'SASL LOGIN authentication failed'))"
      groupby: evt.Meta.source_ip
      capacity: 3
      leakspeed: 10s
      blackhole: 5m
      labels:
        service: postfix
        behavior: "smtp:bruteforce"
        classification:
          - attack.T1110
        confidence: 3
        spoofable: 0
        remediation: true
    local-dovecot-bf-fast.yaml: |
      type: leaky
      name: local/dovecot-bf-fast
      description: "Detect Dovecot bruteforce by password mismatch string"
      debug: false
      filter: "evt.Parsed.program == 'dovecot' && (evt.Parsed.message contains 'Password mismatch' || evt.Line.Raw contains 'Password mismatch')"
      groupby: evt.Meta.source_ip
      capacity: 3
      leakspeed: "10s"
      labels:
        confidence: 3
        spoofable: 0
        classification:
          - attack.T1110
        behavior: "pop3/imap:bruteforce"
        label: "Dovecot Bruteforce Fast detection"
        service: dovecot
        remediation: true

  parsers:
    s01-parse:
      local-dovecot-logs.yaml: |
        #contribution by @ltsich
        onsuccess: next_stage
        debug: false
        filter: "evt.Parsed.program == 'dovecot'"
        name: local/dovecot-logs
        description: "Parse dovecot logs"
        pattern_syntax:
          AUTH_FUNC: '[A-Za-z0-9_]+(\(\))?'
        nodes:
          - grok:
              pattern: "%{WORD:protocol}-login: %{DATA:dovecot_login_message}: user=<%{DATA:dovecot_user}>.*, rip=%{IP:dovecot_remote_ip}, lip=%{IP:dovecot_local_ip}"
              apply_on: message
          - grok:
              pattern: "auth-worker\\(%{INT}\\): %{WORD:dovecot_user_backend}\\(%{DATA:dovecot_user},%{IP:dovecot_remote_ip},?%{DATA}\\): (%{AUTH_FUNC:auth_func} failed: )?%{DATA:dovecot_login_message}$"
              apply_on: message
          - grok:
              pattern: "auth-worker\\(%{INT}\\): (Info: )?conn unix:auth-worker \\(pid=%{INT},uid=%{INT}\\): auth-worker<%{INT}>: %{WORD:dovecot_user_backend}\\(%{DATA:dovecot_user},%{IP:dovecot_remote_ip},?%{DATA}\\): (%{AUTH_FUNC:auth_func} failed: )?%{DATA:dovecot_login_message}$"
              apply_on: message
          - grok:
              pattern: "auth: passwd-file\\(%{DATA:dovecot_user},%{IP:dovecot_remote_ip}.*\\): (%{AUTH_FUNC:auth_func} failed: )?%{DATA:dovecot_login_message}$"
              apply_on: message
        statics:
            - meta: log_type
              value: dovecot_logs
            - meta: source_ip
              expression: "evt.Parsed.dovecot_remote_ip"
            - meta: dovecot_login_result
              expression: "any(['Authentication failure', 'Password mismatch', 'password mismatch', 'auth failed', 'unknown user'], {evt.Parsed.dovecot_login_message contains #}) ? 'auth_failed' : ''"

  # parsers:
  #   s01-parse:
  #     00-mailserver-k3s-multiplexer.yaml: |
  #       name: hobart2967/mailserver-k3s-multiplexer
  #       description: "Präziser K3s-Multiplexer für docker-mailserver"
  #       filter: "evt.Line.Labels.type == 'mailserver-k3s'"
  #       # Do not use `onsuccess: next_stage` here. The bundled Postfix and
  #       # Dovecot parsers are also in s01-parse; advancing the event would
  #       # skip them, so no mail-auth scenario could ever receive an event.
  #       pattern_syntax:
  #         MAIL_PROGRAM: 'postfix(?:/[A-Za-z0-9._-]+)*/smtpd|dovecot'
  #       grok:
  #         # docker-mailserver emits lines like:
  #         #   postfix/smtpd[12345]: ...
  #         #   dovecot: ...
  #         # We keep the full postfix service path ending in smtpd, because the
  #         # postfix hub parser expects it. Dovecot stays normalized to dovecot.
  #         pattern: ".*%{MAIL_PROGRAM:true_program}(?:\\[%{INT}\\])?:%{SPACE}%{GREEDYDATA:clean_message}"
  #         apply_on: Line.Raw
  #       statics:
  #         # Keep the program normalized for dovecot, but preserve postfix/smtpd.
  #         # `parsed`, rather than `target`, is required to update a Parsed
  #         # field. Postfix's parser filters on programs ending in `/smtpd`.
  #         - parsed: program
  #           expression: evt.Parsed.true_program
  #         - target: Line.Raw
  #           expression: evt.Parsed.clean_message
  #         - target: evt.Parsed.message
  #           expression: evt.Parsed.clean_message

agent:
  # Acquire logs from running pods for threat detection
  additionalAcquisition:
    # Host ssh auth logs
    - source: file
      filenames:
        - /var/log/auth.log
      labels:
        type: syslog
      poll_without_inotify: true
    # - source: file
    #   filenames:
    #     - /var/log/containers/mail-docker-mailserver-*_sys-mail_*.log
    #   poll_without_inotify: true
    #   force_inotify: true
    #   labels:
    #     # Ein einzigartiger Typ verhindert, dass Traefik/Nginx diese Zeilen anfassen
    #     type: mailserver-k3s

  acquisition:
    - namespace: sys-traefik
      podName: traefik-operator-*
      program: traefik
      poll_without_inotify: true

    # Minecraft game server
    - namespace: project-minecraft-avsn
      podName: avsn-minecraft-*
      program: minecraft
      poll_without_inotify: true

    # ARK game servers
    - namespace: project-ark
      podName: ark-*
      program: syslog
      poll_without_inotify: true

    # LocalStack security proxy
    - namespace: sys-localstack
      podName: localstack-localstack-security-*
      program: syslog
      poll_without_inotify: true

    # DNS / bind9 (bindy-managed Bind9Instance)
    - namespace: sys-dns
      podName: public-dns-*
      program: named
      poll_without_inotify: true

    # Mail server – postfix
    # Only watch the long-lived docker-mailserver pod; setup-mailbox Job pods are
    # temporary and their log files disappear after the TTL cleanup, which triggers
    # these stale-file warnings from CrowdSec's inotify watcher.
    - namespace: sys-mail
      podName: mail-docker-mailserver-*
      program: postfix
      poll_without_inotify: true

    # # Mail server – dovecot
    - namespace: sys-mail
      podName: mail-docker-mailserver-*
      program: dovecot
      poll_without_inotify: true

    # Grafana (kube-prometheus-stack)
    - namespace: monitoring
      podName: prometheus-grafana-*
      program: grafana
      poll_without_inotify: true

    # ntfy notification server
    - namespace: sys-ntfy
      podName: ntfy-*
      program: ntfy
      poll_without_inotify: true

    # - namespace: sys-mail
    #   podName: mail-docker-mailserver-*
    #   program: docker-mailserver
    #   poll_without_inotify: true

  env:
    - name: GOMEMLIMIT
      value: "1GiB"
    - name: COLLECTIONS
      value: >-
        crowdsecurity/traefik
        crowdsecurity/linux
        crowdsecurity/postfix
        crowdsecurity/dovecot
        mstilkerich/bind9
        LePresidente/grafana
        crowdsecurity/sshd
      # Jgigantino31/ntfy
    - name: DISABLE_SCENARIOS
      value: crowdsecurity/http-crawl-non_statics

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 2Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-grafana

lapi:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-grafana

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

  # The Traefik bouncer key is stored in the crowdsec-bouncer-key K8s secret.
  # The secret must be pre-created via host-secrets (1Password vault entry:
  # "crowdsec-bouncer-key" with field "api-key").
  env:
    - name: GOMEMLIMIT
      value: "1GiB"
    - name: BOUNCER_KEY_TRAEFIK
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncer-key
          key: api-key

  # Register the Traefik bouncer on LAPI startup using the predefined key
  lifecycle:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            until cscli lapi status > /dev/null 2>&1; do
              echo "Waiting for CrowdSec LAPI..."
              sleep 2
            done
            cscli bouncers delete traefik-bouncer 2>/dev/null || true
            cscli bouncers add traefik-bouncer --key "${BOUNCER_KEY_TRAEFIK}"
            echo "Traefik bouncer registered"

  persistentVolume:
    data:
      enabled: true
      size: 1Gi
    config:
      enabled: true
      size: 100Mi
