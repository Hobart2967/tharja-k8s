name: System - Docker Registry
on:
  push:
    paths:
      - '.github/workflows/on-push-system-docker.yml'
      - 'k8s/helm/project/**'
      - 'k8s/helm/htpasswd/**'
      - 'k8s/helm/website/**'
      - 'k8s/system/sys-docker-registry/**'
  workflow_dispatch:
  # Called directly by sync.yml to bypass the GITHUB_TOKEN push restriction
  # (pushes made by GITHUB_TOKEN do not trigger on:push in other workflows).
  workflow_call:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
permissions:
  contents: read
  packages: read


jobs:
  on_push:
    name: Sync System - Docker Registry
    uses: ./.github/workflows/_project-workflow.yml
    permissions:
      statuses: write
    with:
      project_dir: k8s/system/sys-docker-registry
      helmfile_args: --debug && kubectl get secret admin-user -n sys-docker-registry && kubectl auth can-i get secret -n sys-docker-registry
    secrets: inherit
