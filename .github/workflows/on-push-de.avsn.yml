name: de.avsn
on:
  push:
    paths:
      - '.github/workflows/_project-workflow.yml'
      - '.github/workflows/on-push-de.avsn.yml'
      - 'k8s/projects/de.avsn/**'
      - 'k8s/helm/mariadb-database/**'
      - 'k8s/helm/website/**'
      - 'k8s/helm/postnuke/**'
      - 'k8s/helm/project/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single

permissions:
  contents: read
  packages: read

jobs:
  on_push:
    name: Release
    uses: ./.github/workflows/_project-workflow.yml
    permissions:
      statuses: write
    with:
      namespace: project-de-avsn
      project_dir: k8s/projects/de.avsn
      helmfile_args: ""
    secrets: inherit