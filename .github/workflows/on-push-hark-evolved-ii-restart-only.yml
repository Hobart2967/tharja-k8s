name: Hark Evolved II - Force Restart
on:
  workflow_dispatch:
  # Called directly by sync.yml to bypass the GITHUB_TOKEN push restriction
  # (pushes made by GITHUB_TOKEN do not trigger on:push in other workflows).
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
permissions:
  contents: read
  packages: read

jobs:
  on_push:
    name: Release
    uses: ./.github/workflows/_restart-deployments.yml
    permissions:
      statuses: write
    with:
      deployments: ark-2
      namespace: project-ark-2
    secrets: inherit
