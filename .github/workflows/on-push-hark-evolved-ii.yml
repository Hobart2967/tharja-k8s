name: Hark Evolved II
on:
  push:
    paths:
      - '.github/workflows/on-push-hark-evolved-ii.yml'
      - 'k8s/projects/ark-2/**'
      - 'k8s/helm/project/**'
      - 'k8s/helm/traefik-endpoint/**'
      - 'k8s/helm/ark-gameserver/**'
  workflow_dispatch:
  # Called directly by sync.yml to bypass the GITHUB_TOKEN push restriction
  # (pushes made by GITHUB_TOKEN do not trigger on:push in other workflows).
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
permissions:
  contents: read
  packages: read

jobs:
  on_push:
    name: Sync ARK:SE II
    uses: ./.github/workflows/_project-workflow.yml
    permissions:
      statuses: write
    with:
      project_dir: k8s/projects/ark-2
    secrets: inherit