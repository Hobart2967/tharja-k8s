name: Gwen
on:
  push:
    paths:
      - '.github/workflows/on-push-gwen.yml'
      - 'k8s/projects/gwen-test/**'
      - 'k8s/helm/project/**'
  workflow_dispatch:
  # Called directly by sync.yml to bypass the GITHUB_TOKEN push restriction
  # (pushes made by GITHUB_TOKEN do not trigger on:push in other workflows).
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
permissions:
  contents: read
  packages: read
jobs:
  on_push:
    name: Sync Gwen
    uses: ./.github/workflows/_project-workflow.yml
    permissions:
      statuses: write
    with:
      project_dir: k8s/projects/gwen-test
    secrets: inherit