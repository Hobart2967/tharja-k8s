name: engineer.marcoklein
on:
  push:
    paths:
      - 'projects/engineer.marcoklein/**'
  workflow_dispatch:
  # Called directly by sync.yml to bypass the GITHUB_TOKEN push restriction
  # (pushes made by GITHUB_TOKEN do not trigger on:push in other workflows).
  workflow_call:
permissions:
  contents: read
  packages: read

jobs:
  on_push:
    name: Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/helmfile/helmfile:v1.1.0
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Add k8s Auth
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K8S_AUTH }}" > ~/.kube/config
      - name: Sync Helmfile
        run: |
          cd k8s/projects/engineer.marcoklein
          helmfile template
      - name: Sync Helmfile
        run: |
          cd k8s/projects/engineer.marcoklein
          helmfile sync
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
