name: System - AI Backend
on:
  push:
    paths:
      - '.github/workflows/on-push-system-ai.yml'
      - '.github/workflows/_project-workflow.yml'
      - 'k8s/helm/project/**'
      - 'k8s/helm/ai-backend/**'
      - 'k8s/system/sys-ai/**'
      - 'k8s/system/helmfile.yaml'
  workflow_dispatch:
  # Called directly by sync.yml to bypass the GITHUB_TOKEN push restriction
  # (pushes made by GITHUB_TOKEN do not trigger on:push in other workflows).
  workflow_call:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
permissions:
  contents: read
  packages: read


jobs:
  on_push:
    name: Render and Sync System - AI Backend
    uses: ./.github/workflows/_project-workflow.yml
    permissions:
      statuses: write
    with:
      project_dir: k8s/system/sys-ai
    secrets: inherit
