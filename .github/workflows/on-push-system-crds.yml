name: System - CRDs
on:
  push:
    paths:
      - '.github/workflows/on-push-system-crds.yml'
      - 'k8s/system/crds-*/**'
      - 'k8s/system/helmfile.crds.yaml'
  workflow_dispatch:
  # Called directly by sync.yml to bypass the GITHUB_TOKEN push restriction
  # (pushes made by GITHUB_TOKEN do not trigger on:push in other workflows).
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
permissions:
  contents: read
  packages: read


jobs:
  on_push:
    name: Sync CRDs
    uses: ./.github/workflows/_project-workflow.yml
    permissions:
      statuses: write
    with:
      project_dir: k8s/system
      helmfile_args: "-f helmfile.crds.yaml"
    secrets: inherit