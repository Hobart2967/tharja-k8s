name: CRDs
on:
  push:
    paths:
      - '.github/workflows/on-push-system-crds.yml'
      - 'k8s/system/crds-*/**'
      - 'k8s/system/helmfile.crds.yaml'
  workflow_dispatch:
  # Called directly by sync.yml to bypass the GITHUB_TOKEN push restriction
  # (pushes made by GITHUB_TOKEN do not trigger on:push in other workflows).
  workflow_call:

env:
  #namespace: project-planningpoker
  #deployments: website
  project_dir: k8s/system

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
permissions:
  contents: read
  packages: read

jobs:
  on_push:
    name: Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/helmfile/helmfile:v1.1.0
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download and install yq
        run: |
          mkdir ~/.yqtmp
          cd ~/.yqtmp
          export ARCH=$(uname -m)
          echo "Detected architecture: ${ARCH}"
          if [[ "${ARCH}" == "x86_64" ]]; then
            ARCH="amd64"
          elif [[ "${ARCH}" == "aarch64" ]]; then
            ARCH="arm64"
          else
            echo "Unsupported architecture: ${ARCH}"
            exit 1
          fi
          echo "Downloading yq for architecture: https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_${ARCH}.tar.gz"
          wget https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_${ARCH}.tar.gz -O yq.tar.gz
          tar -xzf yq.tar.gz
          ls -l
          rm yq.tar.gz
          mv yq_linux_${ARCH} /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
      - uses: actions/checkout@v3
      - name: Add k8s Auth
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K8S_AUTH }}" > ~/.kube/config
      - name: Template Helmfile
        run: |
          cd ${{ env.project_dir }}
          helmfile template -f helmfile.crds.yaml
      - name: Run the action # You would run your tests before this using the output to set state/desc
        uses: mapbox/create-status-check@v1
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: 'HelmfileRender'
          description: 'Passed'
          state: 'success'
          sha: ${{github.event.pull_request.head.sha || github.sha}}
      - name: Sync Helmfile
        run: |
          cd ${{ env.project_dir }}
          helmfile sync -f helmfile.crds.yaml
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
