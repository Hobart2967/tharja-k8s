  #   source: spigot
  #   args:
  #     id: 6583
  #     version: 542512 # 2.7.1
  # - name: Chairs
  #   source: curl
  #   args:
  #     version: 5.1
  #     url: https://dev.bukkit.org/projects/chairsreloaded/files/2725118/download

extraPorts: []
